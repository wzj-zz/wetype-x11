name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: 安装构建依赖
        run: sudo apt-get update && sudo apt-get install -y gcc make curl

      - name: 缓存静态 libopus
        uses: actions/cache@v4
        with:
          path: vendor/opus
          key: opus-1.5.2-${{ runner.os }}-${{ runner.arch }}

      - name: 构建
        run: ./build.sh

      - name: 校验产物
        run: |
          file wetype-x11 | grep -q "statically linked"
          ./wetype-x11 --check || true
          sha256sum wetype-x11 > wetype-x11.sha256
          cat wetype-x11.sha256

      - name: 发布到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
              gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
            gh release upload "${GITHUB_REF_NAME}" wetype-x11 wetype-x11.sha256 --clobber
          else
            gh release delete latest --yes --cleanup-tag 2>/dev/null || true
            gh release create latest wetype-x11 wetype-x11.sha256 \
              --target "$GITHUB_SHA" --title "latest (main 分支自动构建)" --prerelease \
              --notes "main 分支每次 push 自动构建的预发布版本"
          fi
